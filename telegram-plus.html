<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TELEGRAM+ | ALMOGHANI</title>
<style>
:root{--bg:#04060a;--panel:#0b1018;--line:rgba(99,231,255,.16);--cyan:#63e7ff;--vio:#9b7cff;--txt:#f3f8ff;--muted:#8492a5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,rgba(99,231,255,.14),transparent 32%),radial-gradient(circle at 90% 12%,rgba(155,124,255,.12),transparent 28%),#04060a;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(99,231,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(99,231,255,.025) 1px,transparent 1px);background-size:28px 28px}
.shell{width:min(1060px,calc(100% - 28px));margin:auto;padding:16px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border:1px solid var(--line);border-radius:18px;background:rgba(8,12,18,.78);backdrop-filter:blur(16px);position:sticky;top:9px;z-index:5}.top a{color:#fff;text-decoration:none}.logo{font-weight:900;letter-spacing:2px}.logo span{color:var(--cyan)}.hero{text-align:center;padding:64px 8px 32px}.kicker{font:11px ui-monospace,monospace;letter-spacing:3px;color:var(--cyan)}h1{font-size:clamp(42px,9vw,78px);margin:10px 0 8px;line-height:.95;background:linear-gradient(110deg,#fff,var(--cyan),var(--vio));background-clip:text;-webkit-background-clip:text;color:transparent}.hero p{max-width:650px;margin:15px auto;color:var(--muted);line-height:1.8}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font:10px ui-monospace,monospace;color:#b7c7d8}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.app{position:relative;min-height:210px;padding:19px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,rgba(16,23,34,.9),rgba(7,11,17,.82));overflow:hidden}.app:after{content:"";position:absolute;width:110px;height:110px;right:-40px;top:-40px;background:var(--cyan);opacity:.06;filter:blur(45px);border-radius:50%}.ico{width:52px;height:52px;border-radius:16px;border:1px solid var(--line);display:grid;place-items:center;font-size:26px;background:rgba(255,255,255,.025)}.type{font:9px ui-monospace,monospace;color:var(--cyan);letter-spacing:1.5px;margin-top:17px}.app h3{margin:6px 0;font-size:19px}.app p{color:var(--muted);font-size:12px;line-height:1.6}.actions{display:flex;gap:8px;margin-top:14px}.btn{display:inline-block;text-decoration:none;padding:9px 12px;border-radius:11px;font-size:12px;font-weight:800;background:var(--cyan);color:#041016}.btn.alt{background:transparent;color:#c7d5e4;border:1px solid var(--line)}
.notice{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:18px;color:#8492a5;background:rgba(255,255,255,.02);font-size:12px;line-height:1.7}footer{text-align:center;padding:35px 0;color:#526071;font:10px ui-monospace,monospace;letter-spacing:2px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.app{min-height:185px}}
</style>
<style>.tool{max-width:680px;margin:auto;padding:22px;border:1px solid var(--line);border-radius:24px;background:rgba(10,16,24,.82)}input,textarea{width:100%;padding:13px;margin:7px 0;border:1px solid var(--line);border-radius:12px;background:#05080d;color:#fff;outline:0}button{padding:12px 15px;border:0;border-radius:12px;background:var(--cyan);font-weight:900}#out{margin-top:14px;color:var(--cyan);word-break:break-all}</style></head><body><main class="shell"><header class="top"><div class="logo">ALMOGHANI <span>// TELEGRAM+</span></div><a href="plus-apps.html">PLUS APPS ←</a></header><section class="hero"><div class="kicker">PLUS MODULE</div><h1>✈️ TELEGRAM+</h1><p>أنشئ رابط مشاركة Telegram بسرعة.</p></section><section class="tool"><input id="url" placeholder="الرابط"><textarea id="txt" placeholder="الرسالة"></textarea><button onclick="go()">إنشاء الرابط</button><div id="out"></div></section><footer>ALMOGHANI DIGITAL SYSTEM</footer></main><script>function go(){let u='https://t.me/share/url?url='+encodeURIComponent(url.value)+'&text='+encodeURIComponent(txt.value);out.innerHTML='<a style="color:#63e7ff" target="_blank" href="'+u+'">فتح Telegram ↗</a><br>'+u}</script></body></html>
