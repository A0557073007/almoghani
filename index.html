<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>AHMED ALMOGHANI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  background:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.page{
  position:relative;
  width:100%;
  max-width:1200px;
  margin:auto;
  overflow:hidden;
}

.bg{
  display:block;
  width:100%;
  height:auto;
}

/* البحث */
.search{
  position:absolute;
  top:31%;
  left:6%;
  right:6%;
  height:5%;
  display:flex;
  z-index:10;
}

.search input{
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  font-size:16px;
}

.search button{
  width:17%;
  border:0;
  background:transparent;
  cursor:pointer;
}

/* مناطق الضغط فوق التصميم */
.link{
  position:absolute;
  display:block;
  z-index:20;
  border-radius:18px;
  text-decoration:none;
  -webkit-tap-highlight-color:transparent;
}

/* ALMOGHANI TOOLS */
.tools{
  left:4%;
  top:43.5%;
  width:44%;
  height:12%;
}

/* الموقع */
.website{
  right:4%;
  top:43.5%;
  width:44%;
  height:12%;
}

/* واتساب */
.whatsapp{
  left:4%;
  top:57%;
  width:28%;
  height:10%;
}

/* X */
.twitter{
  left:36%;
  top:57%;
  width:28%;
  height:10%;
}

/* Snapchat */
.snapchat{
  right:4%;
  top:57%;
  width:28%;
  height:10%;
}

/* البريد */
.email{
  left:4%;
  right:4%;
  top:69%;
  height:10%;
}

.link:active{
  background:rgba(0,0,0,.06);
}

@media(max-width:600px){
  .page{
    width:100%;
  }
}
</style>
</head>

<body>

<main class="page">

  <img
    class="bg"
    src="home.png"
    alt="AHMED ALMOGHANI"
  >

  <form
    class="search"
    action="https://www.google.com/search"
    method="get"
  >
    <input
      type="search"
      name="q"
      aria-label="بحث Google"
    >
    <button
      type="submit"
      aria-label="بحث"
    ></button>
  </form>

  <a
    class="link tools"
    href="/tools.html"
    aria-label="ALMOGHANI TOOLS"
  ></a>

  <a
    class="link website"
    href="/"
    aria-label="الموقع الرئيسي"
  ></a>

  <a
    class="link whatsapp"
    href="https://wa.me/966557073007"
    target="_blank"
    rel="noopener"
    aria-label="WhatsApp"
  ></a>

  <a
    class="link twitter"
    href="https://x.com/op430"
    target="_blank"
    rel="noopener"
    aria-label="X"
  ></a>

  <a
    class="link snapchat"
    href="https://www.snapchat.com/add/Ls460g"
    target="_blank"
    rel="noopener"
    aria-label="Snapchat"
  ></a>

  <a
    class="link email"
    href="mailto:Ahmed@almoghani.net"
    aria-label="البريد الإلكتروني"
  ></a>

</main>

</body>
</html>
